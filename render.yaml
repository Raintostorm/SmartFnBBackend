services:
  - type: web
    name: smart-fnb-be
    runtime: node
    plan: free
    region: singapore
    branch: main
    buildCommand: pnpm run render:build
    startCommand: pnpm run render:start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_VERSION
        value: 24.21.0
      - key: NODE_ENV
        value: production
      - key: API_PREFIX
        value: api/v1
      - key: SWAGGER_ENABLED
        value: 'true'
      - key: SWAGGER_PATH
        value: api/docs
      - key: REALTIME_ENABLED
        value: 'true'
      - key: REALTIME_PATH
        value: /socket.io
      - key: JWT_ACCESS_TTL_SECONDS
        value: '900'
      - key: JWT_REFRESH_TTL_SECONDS
        value: '604800'
      - key: JWT_ISSUER
        value: smart-fnb-backend
      - key: JWT_AUDIENCE
        value: smart-fnb-client
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: REALTIME_CORS_ORIGINS
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: PAYOS_MASTER_KEY
        sync: false
      - key: PAYOS_WEBHOOK_BASE_URL
        value: https://smart-fnb-be.onrender.com/api/v1
      - key: PAYMENT_EXPIRY_JOB_ENABLED
        value: 'true'
      - key: PAYMENT_EXPIRY_JOB_INTERVAL_MS
        value: '60000'
      - key: PAYMENT_EXPIRY_BATCH_SIZE
        value: '100'
      - key: PUBLIC_WEB_URL
        sync: false
      - key: ORDER_TRACKING_SECRET
        sync: false
      - key: EMAIL_PROVIDER
        value: resend
      - key: EMAIL_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      # Keep disabled until the S3-compatible secrets below are configured.
      # Render's local filesystem is ephemeral and must not store receipt history.
      - key: RECEIPT_PDF_ENABLED
        value: 'false'
      - key: RECEIPT_STORAGE_PROVIDER
        value: s3
      - key: RECEIPT_STORAGE_ENDPOINT
        sync: false
      - key: RECEIPT_STORAGE_REGION
        value: auto
      - key: RECEIPT_STORAGE_BUCKET
        sync: false
      - key: RECEIPT_STORAGE_ACCESS_KEY_ID
        sync: false
      - key: RECEIPT_STORAGE_SECRET_ACCESS_KEY
        sync: false
      # Private R2 bucket for menu, logo, and poster uploads.
      - key: ASSET_STORAGE_PROVIDER
        value: s3
      - key: ASSET_STORAGE_ENDPOINT
        sync: false
      - key: ASSET_STORAGE_REGION
        value: auto
      - key: ASSET_STORAGE_BUCKET
        sync: false
      - key: ASSET_STORAGE_ACCESS_KEY_ID
        sync: false
      - key: ASSET_STORAGE_SECRET_ACCESS_KEY
        sync: false
